{% set name = "natcap.invest" %}
{% set version = "3.20.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace(".", "_") }}-{{ version }}.tar.gz
  sha256: ac12039037cd55b931b525abd92def7c749b372c8c9d9400a2c8e64ce9f5433f

build:
  number: 0
  skip: true  # [py==314 and libgdal=="3.9"]
  script_env:
    - NATCAP_INVEST_GDAL_LIB_PATH={{ CONDA_PREFIX }}/Library
  script:
    # Force re-cythonization by deleting any existing cython files.
    # Re-cythonization needed because of varying numpy ABIs in conda-forge matrix.
    - {{ PYTHON }} -c "import os; from pathlib import Path; [f.unlink() for f in Path(os.environ['SRC_DIR']).rglob('*.cpp')]"
    - {{ PYTHON }} -m build --wheel --no-isolation --skip-dependency-check -vv
    - {{ PYTHON }} -m build --sdist --no-isolation --skip-dependency-check -vv
    - {{ PYTHON }} -m pip install --no-deps --no-index --only-binary natcap.invest --no-build-isolation --find-links=dist "natcap.invest=={{ version }}"
  entry_points:
    - invest = natcap.invest.cli:main

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >3.0.0                          # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - babel
    - cython >3.0.0
    - libgdal-core {{ libgdal }}
    - numpy
    - pygeoprocessing >=2.4.10
    - setuptools_scm
    - setuptools >=77.0  # For PEP 639 license syntax update
    - wheel
    - python-build
    - rtree >=0.8.2,!=0.9.1
  run:
    - python
    - libsqlite !=3.49.1  # https://github.com/conda-forge/sqlite-feedstock/issues/130
    - sqlite !=3.49.1     # https://github.com/conda-forge/sqlite-feedstock/issues/130
    - babel
    - chardet >=3.0.4
    - cython >3.0.0
    - docutils
    - flask
    - flask-cors
    - geometamaker >=0.3.1
    - numpy >=1.11.0,!=1.16.0
    - pandas >=1.2.1
    - pint
    - psutil >=5.6.6
    - gdal >=3.4.2
    - libgdal-core {{ libgdal }}  # run against the same version we build against.
    - pyro5
    - requests
    - rtree >=0.8.2,!=0.9.1
    - scipy >=1.9.0
    - shapely >=2.0.0
    - taskgraph >=0.11.0
    - altair >=6.0.0
    - fiona
    - geopandas-base
    - jinja2
    - matplotlib-base
    - distinctipy

test:
  imports:
    - natcap.invest
  requires:
    - pip
  commands:
    - pip check
    - invest list

about:
  home: https://github.com/natcap/invest
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: 'InVEST: models that map and value the goods and services from nature that sustain and fulfill human life.'
  description: |
    InVEST (Integrated Valuation of Ecosystem Services and Tradeoffs) is a family of tools for quantifying the values of natural capital in clear, credible, and practical ways. In promising a return (of societal benefits) on investments in nature, the scientific community needs to deliver knowledge and tools to quantify and forecast this return. InVEST enables decision-makers to quantify the importance of natural capital, to assess the tradeoffs associated with alternative choices, and to integrate conservation and human development.
  doc_url: https://invest.readthedocs.io/
  dev_url: https://github.com/natcap/invest

extra:
  recipe-maintainers:
    - claire-simpson
    - davemfish
    - dcdenu4
    - phargogh
    - davemfish
    - emlys
